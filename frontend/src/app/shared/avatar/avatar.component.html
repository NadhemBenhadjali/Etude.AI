<!-- ✅ Logout (Fixed LEFT) -->
<button class="logout-btn" (click)="logout()" title="تسجيل الخروج">
  <img src="assets/images/check-out.png" alt="logout" class="logout-icon">
  <span class="mini-tooltip">تسجيل الخروج</span>
</button>

<!-- ✅ Profile Avatar (Fixed RIGHT) -->
<a routerLink="/profile" class="avatar-link" title="الملف الشخصي">
  <img [src]="avatarUrl" alt="User Avatar" class="avatar" />
</a>
