<form class="signup-form" (ngSubmit)="signup()" #signupForm="ngForm" novalidate>
  <h2>🌟اعمل حساب جديد🌟</h2>

  <div class="input-group">
    <input type="text" id="firstName" name="firstName" [(ngModel)]="name" required placeholder=" "
      autocomplete="given-name" />
    <label for="firstName">الاسم</label>
  </div>

  <div class="input-group">
    <input type="text" id="lastName" name="lastName" [(ngModel)]="lastName" required placeholder=" "
      autocomplete="family-name" />
    <label for="lastName">اللقب</label>
  </div>

  <div class="input-group">
    <input type="email" id="email" name="email" [(ngModel)]="email" required placeholder=" " autocomplete="email" />
    <label for="email">الإيميل</label>
  </div>

  <div class="input-group">
    <input type="password" id="password" name="password" [(ngModel)]="password" required placeholder=" "
      autocomplete="new-password" />
    <label for="password">كلمة السر</label>
  </div>

  <div class="input-group">
    <input type="password" id="confirmPassword" name="confirmPassword" [(ngModel)]="confirmPassword" required
      placeholder=" " autocomplete="new-password" />
    <label for="confirmPassword">أكّد كلمة السر</label>
  </div>

  <div class="input-group">
    <input type="date" id="birthDate" name="birthDate" [(ngModel)]="birthDate" required placeholder=" "
      autocomplete="bday" />
    <label for="birthDate">تاريخ الميلاد 🎂</label>
  </div>

  <div class="input-group">
    <select id="level" name="level" [(ngModel)]="level" required>
      <option *ngFor="let levelOption of levels" [value]="levelOption.value">
        {{ levelOption.label }}
      </option>
    </select>
    <label for="level">السنة الدراسية 📚</label>
  </div>

  <div class="avatar-selection">
    <h3>اختار تصويرة</h3>
    <div class="avatar-list">
      <img *ngFor="let avatar of avatars" [src]="avatar" (click)="selectAvatar(avatar)"
        [class.selected]="avatar === selectedAvatar" />
    </div>
  </div>

  <div *ngIf="errorMessage"
    style="color: #ff4444; background: #ffebee; padding: 10px; border-radius: 5px; margin: 10px 0; text-align: center;">
    {{ errorMessage }}
  </div>

  <div *ngIf="successMessage"
    style="color: #00C851; background: #e8f5e9; padding: 10px; border-radius: 5px; margin: 10px 0; text-align: center;">
    {{ successMessage }}
  </div>

  <button type="submit" [disabled]="!signupForm.form.valid">واصل</button>
  <p class="simple-link">
    عندكش حساب؟ <a (click)="goToSignIn()" class="text-link">ادخل</a>
  </p>
</form>
