<div class="signup-page" dir="rtl">
  <div class="signup-container">
    
    <div class="signup-header">
      <div class="header-flag-badge">🇹🇳 Etude.AI انضمام جديد</div>
      <h2>🌟 حساب جديد لبطلنا الصغير! 🌟</h2>
      <p class="subtitle">عمّر المعلومات واختار صورتك المفضلة باش تبدا تقرا وتربح نقاط ونجوم 🚀</p>
    </div>

    <form class="signup-form-card" (ngSubmit)="signup()" #signupForm="ngForm" novalidate>
      
      <!-- Section 1: Basic Info -->
      <div class="form-section-title">
        <span>👤 1. المعلومات الشخصية</span>
      </div>

      <div class="form-grid">
        <div class="input-field">
          <label for="firstName">الاسم *</label>
          <input
            type="text"
            id="firstName"
            name="firstName"
            [(ngModel)]="name"
            required
            placeholder="مثال: أحمد"
            autocomplete="given-name"
          />
        </div>

        <div class="input-field">
          <label for="lastName">اللقب *</label>
          <input
            type="text"
            id="lastName"
            name="lastName"
            [(ngModel)]="lastName"
            required
            placeholder="مثال: الطرابلسي"
            autocomplete="family-name"
          />
        </div>

        <div class="input-field">
          <label for="email">البريد الإلكتروني (للولي أو التلميذ) *</label>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="email"
            required
            placeholder="example@mail.com"
            autocomplete="email"
          />
        </div>

        <div class="input-field">
          <label for="birthDate">تاريخ الميلاد 🎂 *</label>
          <input
            type="date"
            id="birthDate"
            name="birthDate"
            [(ngModel)]="birthDate"
            required
            autocomplete="bday"
          />
        </div>

        <div class="input-field">
          <label for="password">كلمة السر 🔒 *</label>
          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="password"
            required
            placeholder="••••••••"
            autocomplete="new-password"
          />
        </div>

        <div class="input-field">
          <label for="confirmPassword">تأكيد كلمة السر 🔒 *</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            required
            placeholder="••••••••"
            autocomplete="new-password"
          />
        </div>

        <div class="input-field full-width">
          <label for="level">السنة الدراسية الابتدائية 📚 *</label>
          <select id="level" name="level" [(ngModel)]="level" required>
            <option *ngFor="let levelOption of levels" [value]="levelOption.value">
              {{ levelOption.label }}
            </option>
          </select>
        </div>
      </div>

      <!-- Section 2: Avatar Selection -->
      <div class="form-section-title">
        <span>🎨 2. اختار الأفاتار (صورتك في المنصة) *</span>
      </div>

      <div class="avatar-grid-wrapper">
        <div
          class="avatar-card"
          *ngFor="let avatar of avatars"
          (click)="selectAvatar(avatar)"
          [class.selected]="avatar === selectedAvatar"
        >
          <img [src]="avatar" alt="Avatar option" />
          <span class="selected-check" *ngIf="avatar === selectedAvatar">✓</span>
        </div>
      </div>

      <!-- Error / Success Feedback -->
      <div *ngIf="errorMessage" class="feedback-box error">
        <span>⚠️ {{ errorMessage }}</span>
      </div>

      <div *ngIf="successMessage" class="feedback-box success">
        <span>🎉 {{ successMessage }}</span>
      </div>

      <!-- Submit Actions -->
      <div class="form-actions">
        <button type="submit" class="submit-signup-btn" [disabled]="!signupForm.form.valid">
          <span>إنشاء الحساب وبدء المغامرة 🚀</span>
        </button>

        <p class="login-redirect">
          عندك حساب من قبل؟ <a (click)="goToSignIn()" class="login-link">تسجيل الدخول من هنا 👈</a>
        </p>
      </div>

    </form>
  </div>
</div>
