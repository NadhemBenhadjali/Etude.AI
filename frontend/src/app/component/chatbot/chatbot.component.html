<div class="chatbot-page" dir="rtl">
  <!-- Studio Top Bar -->
  <header class="chat-top-bar">
    <div class="bot-profile-badge">
      <div class="bot-avatar-wrap">
        <img src="/assets/images/bot.png" alt="AI Robot" class="bot-avatar" />
        <span class="online-indicator"></span>
      </div>
      <div class="bot-meta">
        <div class="bot-name-row">
          <span class="bot-name">المعلم الذكي</span>
          <span class="bot-chip">🇹🇳 تونسي 100%</span>
        </div>
        <span class="bot-status-text">جاهز لتفسير كل دروسك بالتونسي المبسط</span>
      </div>
    </div>

    <div class="chat-actions">
      <button class="save-chat-btn" (click)="saveSession()" [disabled]="messages.length <= 1">
        <span>💾 حفظ الجلسة وإنهاء</span>
      </button>
      <button class="exit-btn" routerLink="/dashboard">
        <span>🏠 الرئيسية</span>
      </button>
    </div>
  </header>

  <!-- Main Chat Conversation Arena -->
  <main class="chat-arena">
    <div class="messages-flow">
      <div
        *ngFor="let message of messages"
        class="message-row"
        [ngClass]="{ 'user-row': message.isUser, 'bot-row': !message.isUser }"
      >
        <div class="msg-avatar">
          <img *ngIf="!message.isUser" src="/assets/images/bot.png" alt="Tutor" />
          <img *ngIf="message.isUser" src="/assets/images/panda.png" alt="Student" />
        </div>

        <div class="msg-bubble-wrap">
          <div class="msg-bubble" [innerHTML]="message.text"></div>
          <span class="msg-sender-tag">{{ message.isUser ? 'أنت (البطل) 🎒' : 'المعلم الذكي 🤖' }}</span>
        </div>
      </div>

      <!-- Typing Indicator -->
      <div *ngIf="isLoading" class="message-row bot-row">
        <div class="msg-avatar">
          <img src="/assets/images/bot.png" alt="Tutor" />
        </div>
        <div class="msg-bubble-wrap">
          <div class="msg-bubble typing-bubble">
            <div class="dots-wave">
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </div>
          </div>
          <span class="msg-sender-tag">المعلم يكتب الآن... ⏳</span>
        </div>
      </div>
    </div>

    <!-- Quick Tunisian Prompt Chips -->
    <div class="quick-chips-bar">
      <span class="chips-label">💡 أسئلة مقترحة:</span>
      <div class="chips-scroll">
        <button class="chip-btn" (click)="sendQuickResponse('فسرلي كيفاش تخدم الحواس الخمسة؟')">
          🌿 فسرلي الحواس الخمسة
        </button>
        <button class="chip-btn" (click)="sendQuickResponse('عطيني مسألة رياضية مسلية لسنة رابعة')">
          🔢 مسألة رياضيات مسلية
        </button>
        <button class="chip-btn" (click)="sendQuickResponse('كيفاش نفرق بين الفعل والاسم؟')">
          📖 الفرق بين الفعل والاسم
        </button>
        <button class="chip-btn" (click)="sendQuickResponse('احكيلي نكتة تونسية خفيفة!')">
          😄 احكيلي نكتة
        </button>
      </div>
    </div>

    <!-- Bottom Input Bar -->
    <div class="chat-input-bar">
      <div class="input-shell">
        <input
          type="text"
          [(ngModel)]="userInput"
          (keyup.enter)="sendMessage()"
          placeholder="اكتب سؤالك هنا أو اسأل المعلم على أي درس..."
          [disabled]="isLoading"
        />
        <button class="send-action-btn" (click)="sendMessage()" [disabled]="isLoading || !userInput.trim()">
          <span>إرسال 🚀</span>
        </button>
      </div>
    </div>
  </main>
</div>
