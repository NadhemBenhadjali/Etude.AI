<div class="select-class-page" dir="rtl">
  <div class="center-container">
    <div class="page-badge">🎒 اختر مادتك المفضلة</div>
    <h2 class="instruction">شنيّة المادة اللي تحب تقراها اليوم؟</h2>
    <p class="sub-instruction">اضغط على المادة باش تكتشف الدروس والملخصات الذكية! 🚀</p>

    <div class="class-container">
      <div
        class="class-box"
        *ngFor="let subject of subjects; let i = index"
        (click)="selectSubject(subject.name)"
      >
        <div class="icon-circle">
          <img [src]="'assets/images/' + subject.image" [alt]="subject.name" />
        </div>
        <p class="subject-title">{{ subject.name }}</p>
        <span class="explore-tag">دخول للدروس 👈</span>
      </div>
    </div>
  </div>
</div>
