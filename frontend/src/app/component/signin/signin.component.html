<!-- src/app/component/signin/signin.component.html -->
<div class="signin-container">
  <div class="signin-image">
    <img src="/assets/images/kiddd.png" alt="أطفال يسجلون الدخول" />
  </div>

  <form class="signin-form" dir="rtl" lang="ar" aria-label="فورم تسجيل الدخول" (submit)="onSubmit($event)">
    <h2>🌟 تسجيل الدخول 🌟</h2>

    <!-- Keep the fields if you want the look, but Option A won't use them -->
    <label for="email">📧 الإيميل</label>
    <input type="email" id="email" name="email" placeholder="example@domain.com" />

    <label for="password">🔒 كلمة السر</label>
    <input type="password" id="password" name="password" placeholder="********" />

    <!-- IMPORTANT: this button now triggers the OAuth2 redirect -->
    <button type="submit">🚀 ادخل عبر SSO</button>

    <p class="signup-link">
      ماعندكش حساب؟ <a (click)="goToSignUp()" style="cursor:pointer;">✨ اعمل حساب جديد</a>
    </p>
  </form>
</div>
