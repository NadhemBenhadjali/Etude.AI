<div class="lesson-page" dir="rtl">
  <!-- Top Navigation Bar -->
  <header class="lesson-top-bar">
    <div class="brand-group">
      <button class="back-pill-btn" routerLink="/select-module">
        <span>◀ رجوع للمحاور</span>
      </button>
      <div class="subject-badge-pill">
        <span class="subject-icon">📚</span>
        <span>{{ currentSubject || 'الدرس التفاعلي' }}</span>
      </div>
    </div>

    <div class="lesson-title-box">
      <h1 class="lesson-main-title">{{ title || 'محتوى الدرس' }}</h1>
      <span class="slide-indicator" *ngIf="slides.length > 0">
        الشريحة <strong>{{ slides[currentSlideIndex].number || (currentSlideIndex + 1) }}</strong> من <strong>{{ slides.length }}</strong>
      </span>
    </div>

    <div class="top-action-group">
      <button class="dashboard-link-btn" routerLink="/dashboard">
        <span>🏠 لوحة التحكم</span>
      </button>
    </div>
  </header>

  <!-- Main Interactive Chalkboard Studio -->
  <main class="chalkboard-stage">
    <!-- Slide Navigation Pills -->
    <div class="slides-pills-bar" *ngIf="slides.length > 0">
      <button
        *ngFor="let s of slides; let i = index"
        class="slide-step-btn"
        [class.active]="i === currentSlideIndex"
        (click)="goToSlide(i)"
      >
        <span class="step-num">{{ i + 1 }}</span>
      </button>
    </div>

    <!-- The Chalkboard Display Screen -->
    <div class="chalkboard-frame" *ngIf="slides.length > 0">
      <div class="chalkboard-screen">
        <!-- Slide Image Spotlight (if available) -->
        <div class="slide-media-box" *ngIf="hasPhoto(slides[currentSlideIndex])">
          <img
            [src]="slides[currentSlideIndex].image"
            [alt]="'صورة ' + title"
            class="chalkboard-img"
            (error)="onImageError(slides[currentSlideIndex])"
          />
        </div>

        <!-- Slide Text Content -->
        <div class="slide-text-body" [innerHTML]="slides[currentSlideIndex].text"></div>

        <!-- Audio Narration Floating Pill -->
        <div class="audio-narration-bar">
          <button
            class="tts-action-btn"
            [class.is-speaking]="isPlaying"
            (click)="playSummary()"
          >
            <span class="tts-icon">{{ isPlaying ? '🔇' : '🔊' }}</span>
            <span class="tts-label">{{ isPlaying ? 'إيقاف الصوت' : 'اسمع الدرس بصوت المعلم الذكي 🇹🇳' }}</span>
            <div class="sound-wave-anim" *ngIf="isPlaying">
              <span class="wave-bar"></span>
              <span class="wave-bar"></span>
              <span class="wave-bar"></span>
              <span class="wave-bar"></span>
            </div>
          </button>
        </div>
      </div>
    </div>

    <!-- Bottom Navigation Dock -->
    <footer class="lesson-dock-bar">
      <button
        class="dock-nav-btn prev-btn"
        (click)="prevSlide()"
        [disabled]="currentSlideIndex === 0"
      >
        <span>◀ الشريحة السابقة</span>
      </button>

      <button class="dock-ask-btn" (click)="onQuestion()">
        <span class="btn-emoji">🤖</span>
        <span>اسأل المعلم على هذا الجزء</span>
      </button>

      <button
        class="dock-nav-btn next-btn"
        (click)="nextSlide()"
        *ngIf="currentSlideIndex < slides.length - 1"
      >
        <span>اللي بعدو ▶</span>
      </button>

      <button
        class="dock-finish-btn"
        (click)="openCompletionModal()"
        *ngIf="currentSlideIndex === slides.length - 1"
      >
        <span>🏆 كملت الدرس!</span>
      </button>
    </footer>
  </main>

  <!-- Celebration Modal When Completed -->
  <div class="celebration-overlay" *ngIf="showCompletionModal">
    <div class="celebration-card">
      <div class="celebration-stars">🌟 🎉 🏆 ✨ 🎈</div>
      <h2 class="celebration-title">يعطيك الصحة يا بطل! كملت الدرس 👏</h2>
      <p class="celebration-subtitle">احسنت العمل! معلومات هايلة تعلمتها اليوم. شنيّة تحب تعمل توا؟</p>

      <div class="celebration-actions">
        <button class="action-card-btn quiz-btn" (click)="launchQuizFromLesson()">
          <span class="btn-icon">📝</span>
          <div class="btn-text">
            <strong>عدي اختبار وتحدي توا! 🏆</strong>
            <small>اربح نقاط ونجوم إضافية</small>
          </div>
        </button>

        <button class="action-card-btn chat-btn" (click)="launchChatFromLesson()">
          <span class="btn-icon">🤖</span>
          <div class="btn-text">
            <strong>اسأل المعلم الذكي على الدرس 💬</strong>
            <small>فسر أي حاجة ما فهمتهاش</small>
          </div>
        </button>

        <button class="action-card-btn home-btn" (click)="finishLesson(true)">
          <span class="btn-icon">🏠</span>
          <div class="btn-text">
            <strong>احفظ وارجع للرئيسية 🌟</strong>
            <small>شوف تقدمك وأوسمتك</small>
          </div>
        </button>
      </div>

      <button class="modal-close-btn" (click)="closeCompletionModal()">❌ إغلاق ومراجعة الشريحة</button>
    </div>
  </div>
</div>
