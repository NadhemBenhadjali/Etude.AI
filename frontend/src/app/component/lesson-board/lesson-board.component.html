<app-avatar></app-avatar>
<div class="lesson-container2">
  <div class="lesson-container">

    <h2 class="lesson-title">
      {{ title }} — الشريحة {{ slides[currentSlideIndex].number }}
    </h2>

    <button class="exit-button" routerLink="/select-mode">
      <span>العودة</span>
    </button>

    <div class="image-wrapper">
      <img [src]="boardImage" alt="Board" class="board-image" />

      <div class="overlay-content">
        <img *ngIf="hasPhoto(slides[currentSlideIndex])" [src]="slides[currentSlideIndex].image"
          [alt]="'Slide photo ' + slides[currentSlideIndex].number" class="slide-img" />

        <div class="slide-text" [ngClass]="hasPhoto(slides[currentSlideIndex]) ? 'has-photo' : 'no-photo'"
          [innerHTML]="slides[currentSlideIndex].text"></div>

      </div>
    </div>

    <div class="audio-controls">
      <button class="play-button" (click)="playSummary()" [disabled]="!slides[currentSlideIndex].text || isPlaying">
        الاستماع
      </button>
      <button class="stop-button" (click)="stopSummary()" [disabled]="!isPlaying">
        إيقاف الصوت
      </button>
    </div>

    <div class="button-group">
      <button class="back-button" (click)="prevSlide()" [disabled]="currentSlideIndex === 0">
        العودة ←
      </button>

      <button class="question-button" (click)="onQuestion()">
        <img src="/assets/images/arrow.png" alt="سؤال" class="question-icon" />
      </button>

      <button class="next-button" (click)="nextSlide()" *ngIf="currentSlideIndex < slides.length - 1">
        اللي بعدو →
      </button>

      <!-- Finish Button on Last Slide -->
      <button class="finish-button" (click)="finishLesson()" *ngIf="currentSlideIndex === slides.length - 1"
        style="background-color: #4CAF50; color: white; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px;">
        <span>إنهاء الدرس 🎓</span>
      </button>
    </div>

  </div>
</div>
