[project]
name = "ai-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Khalil KRIFI", email = "Khalil.krifi@ensi-uma.tn" }
]
requires-python = ">=3.14"
dependencies = [
    "crewai>=1.15.16",
    "fastapi>=0.141.1",
    "google-generativeai>=0.8.6",
    "neo4j>=6.2.0",
    "nest-asyncio>=1.6.0",
    "prometheus-client>=0.26.0",
    "qdrant-client>=1.19.0",
    "reportlab>=5.0.0",
    "requests>=2.34.2",
    "slowapi>=0.1.10",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "uvicorn>=0.52.3",
]

[project.scripts]
ai-pipeline = "ai_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

