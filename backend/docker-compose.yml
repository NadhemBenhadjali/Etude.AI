name: Etude.ai
services:
  # ---------- BACKEND DATABASE ----------
  backend-db:
    image: postgres:15
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 20
    container_name: db-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /data/postgres
    volumes:
      - backend_data:/data/postgres
      - ./ops/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - etudeai

  redis:
    image: redis:7-alpine
    container_name: etudeai-redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - etudeai

  ai-pipeline:
    build:
      context: "../AI Pipeline"
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8000:8000"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    env_file:
      - ../.env
    environment:
      - REDIS_URL=${REDIS_URL}
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - LLM_API_KEY=${LLM_API_KEY}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - NGROK_AUTH_TOKEN=${NGROK_AUTH_TOKEN}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    depends_on:
      - redis
    command: [ "python", "-m", "main" ]
    networks:
      - etudeai
  tts-service:
    build:
      context: "../TTS-Integration"
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8002:8000"
    environment:
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    networks:
      - etudeai

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: etudeai-backend
    restart: always
    ports:
      - "8081:8081"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    env_file:
      - ../.env
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - POSTGRES_HOST=backend-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KEYCLOAK_AUTH_SERVER_URL=${KEYCLOAK_AUTH_SERVER_URL}
      - KEYCLOAK_PUBLIC_URL=${KEYCLOAK_PUBLIC_URL}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - KEYCLOAK_RESOURCE=${KEYCLOAK_RESOURCE}
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - AI_PIPELINE_URL=${AI_PIPELINE_URL}
      - SENTRY_DSN_BACKEND=${SENTRY_DSN_BACKEND}
      - ENVIRONMENT=${ENVIRONMENT}
      - RELEASE_VERSION=${RELEASE_VERSION}
    depends_on:
      backend-db:
        condition: service_healthy
      redis:
        condition: service_started
      keycloak:
        condition: service_started
    networks:
      - etudeai

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.2
    container_name: keycloak4
    command: [ "start-dev", "--import-realm" ]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8083:8080"
    volumes:
      - ./ops/keycloak/data:/opt/keycloak/data
      - ./ops/keycloak/import:/opt/keycloak/data/import
      - ./ops/keycloak/themes:/opt/keycloak/themes
    networks:
      - etudeai

  prometheus:
    image: prom/prometheus:latest
    container_name: etudeai-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - etudeai
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: etudeai-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - etudeai
    depends_on:
      - prometheus

networks:
  etudeai:
    driver: bridge

volumes:
  backend_data:
  prometheus_data:
  grafana_data:
