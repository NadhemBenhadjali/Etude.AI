services:
  # ---------- BACKEND DATABASE ----------
  backend-db:
    image: postgres:latest
    container_name: backend-db
    restart: always
    environment:
      POSTGRES_USER: etudeai
      POSTGRES_PASSWORD: etudeai
      POSTGRES_DB: etudeai
    volumes:
      - backend_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  # ---------- BACKEND SERVICE ----------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: etudeai-backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://backend-db:5432/etudeai
      SPRING_DATASOURCE_USERNAME: etudeai
      SPRING_DATASOURCE_PASSWORD: etudeai
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_PROFILES_ACTIVE: docker
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: etudeai
      KEYCLOAK_CLIENT_ID: etudeai-backend
    depends_on:
      - backend-db
      - keycloak
    ports:
      - "8081:8081"

  # ---------- KEYCLOAK DATABASE ----------
  keycloak-db:
    image: postgres:latest
    container_name: keycloak-db
    restart: always
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: keycloak
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # ---------- KEYCLOAK SERVICE ----------
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    restart: always
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_PROXY: edge
      KC_HOSTNAME_STRICT: false
    command: start-dev
    depends_on:
      - keycloak-db
    ports:
      - "8080:8080"

volumes:
  backend_data:
  keycloak_data:
