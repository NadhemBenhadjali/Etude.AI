  keycloak:
    image: quay.io/keycloak/keycloak:24.0.2
    container_name: keycloak4
    command: [ "start-dev" ]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8083:8080"
    volumes:
      - ./ops/keycloak/data:/opt/keycloak/data
      - ./ops/keycloak/themes:/opt/keycloak/themes
    networks:
      - etudeai

networks:
  etudeai:
    driver: bridge


volumes:
  backend_data:
