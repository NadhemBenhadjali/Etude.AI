name: Etude.ai
services:
  # ---------- BACKEND DATABASE ----------
  backend-db:
    image: postgres:15
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d Etudeai " ]
      interval: 5s
      timeout: 3s
      retries: 20
    container_name: db-postgres
    restart: always
    environment:
      POSTGRES_DB: Etudeai
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      PGDATA: /data/postgres
    volumes:
      - backend_data:/data/postgres
      - ./ops/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks:
      - etudeai

