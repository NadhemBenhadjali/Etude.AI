name: Etude.ai
services:

  backend-db:
    image: postgres:15
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 20
    container_name: db-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /data/postgres
    volumes:
      - backend_data:/data/postgres
      - ./ops/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - etudeai
    env_file:
      - ../.env

  neo4j:
      image: neo4j:5.15.0
      container_name: etudeai-neo4j
      restart: always
      environment:
        # sets the initial password for the default neo4j user
        NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}"
        # Memory settings for better performance
        NEO4J_server_memory_pagecache_size: 1G
        NEO4J_server_memory_heap_max__size: 2G
      ports:
        - "7474:7474"
        - "7687:7687"
      volumes:
        - neo4j_data:/data
        - neo4j_logs:/logs
      networks:
        - etudeai
      healthcheck:
        test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 30s

  qdrant:
      image: qdrant/qdrant:v1.7.4
      container_name: etudeai-qdrant
      restart: always
      environment:
        # Optional: Set API key for authentication (leave empty for local development)
        QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY:-}"
      ports:
        - "6333:6333"  # HTTP API
        - "6334:6334"  # gRPC
      volumes:
        - qdrant_data:/qdrant/storage
      networks:
        - etudeai
      healthcheck:
        test: ["CMD-SHELL", "timeout 1 bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 10s


  redis:
    image: redis:7-alpine
    container_name: etudeai-redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - etudeai
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes
    env_file:
      - ../.env

  ai-pipeline:
    build:
      context: "../AI Pipeline"
      dockerfile: Dockerfile
    container_name: etudeai-ai-pipeline
    restart: always
    ports:
      - "8000:8000"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    env_file:
      - ../.env
    environment:
      - REDIS_URL=${REDIS_URL}
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - LLM_API_KEY=${LLM_API_KEY}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - SENTRY_DSN=${SENTRY_DSN}
      - ENVIRONMENT=${ENVIRONMENT}
      - RELEASE_VERSION=${RELEASE_VERSION}
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - etudeai

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: etudeai-backend
    restart: always
    ports:
      - "8081:8081"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    env_file:
      - ../.env
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - POSTGRES_HOST=backend-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KEYCLOAK_AUTH_SERVER_URL=${KEYCLOAK_AUTH_SERVER_URL}
      - KEYCLOAK_PUBLIC_URL=${KEYCLOAK_PUBLIC_URL}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - KEYCLOAK_RESOURCE=${KEYCLOAK_RESOURCE}
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - AI_PIPELINE_URL=${AI_PIPELINE_URL}
      - SENTRY_DSN_BACKEND=${SENTRY_DSN_BACKEND}
      - ENVIRONMENT=${ENVIRONMENT}
      - RELEASE_VERSION=${RELEASE_VERSION}
    depends_on:
      backend-db:
        condition: service_healthy
      redis:
        condition: service_started
      keycloak:
        condition: service_started
    networks:
      - etudeai

  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
      - keycloak
    networks:
      - etudeai
    env_file:
      - ../.env

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.2
    container_name: keycloak4
    command: [ "start-dev", "--import-realm" ]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded

      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8083:8080"
    volumes:
      - ./ops/keycloak/data:/opt/keycloak/data
      - ./ops/keycloak/import:/opt/keycloak/data/import
      - ./ops/keycloak/themes:/opt/keycloak/themes
    networks:
      - etudeai
    env_file:
      - ../.env

  prometheus:
    image: prom/prometheus:latest
    container_name: etudeai-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - etudeai
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: etudeai-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - etudeai
    depends_on:
      - prometheus
    env_file:
      - ../.env

networks:
  etudeai:
    driver: bridge

volumes:
  backend_data:
  prometheus_data:
  grafana_data:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
  redis_data:

