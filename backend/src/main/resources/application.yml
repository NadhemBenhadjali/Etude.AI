server:
  port: 8081

spring:
  application:
    name: EtudeAI

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/Etudeai
    username: admin
    password: admin
  jpa:
    hibernate:
      ddl-auto: update
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      # --- OIDC Login (Option A) ---
      client:
        registration:
          keycloak:
            client-id: ${app.security.client-id}
            client-secret: ${app.security.client-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          keycloak:
            issuer-uri: ${app.security.issuer-uri}
      resourceserver:
        jwt:
          issuer-uri: ${app.security.issuer-uri}

# App-specific settings used by SecurityConfig
app:
  security:
    issuer-uri: http://localhost:8083/realms/etudeAi
    client-id: backend
    client-secret: tUrff0wg8nsWqy1nTZIHoOTpMUw8A65p
    allowed-origins: "http://localhost:4200"
  frontend:
    base-url: http://localhost:4200

