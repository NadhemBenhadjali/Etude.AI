global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Backend metrics
  - job_name: 'etudeai-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend:8081']
        labels:
          application: 'etudeai-backend'
  
  # AI Pipeline metrics (if Flask-Prometheus added)
  - job_name: 'ai-pipeline'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ai-pipeline:8000']
        labels:
          application: 'ai-pipeline'
