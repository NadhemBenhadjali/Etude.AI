apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: etude-ai
  labels:
    app: backend
    tier: application
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        tier: application
    spec:
      containers:
      - name: backend
        image: etude-ai-backend:v1.0.0
        imagePullPolicy: IfNotPresent  # Use local image
        ports:
        - containerPort: 8081
          name: http
        env:
        # Spring Profile
        - name: SPRING_PROFILES_ACTIVE
          value: "production"

        # From ConfigMap
        - name: AI_PIPELINE_URL
          valueFrom:
            configMapKeyRef:
              name: etude-ai-config
              key: AI_PIPELINE_URL
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: etude-ai-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: etude-ai-config
              key: POSTGRES_PORT
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: etude-ai-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: etude-ai-config
              key: REDIS_PORT
        - name: KEYCLOAK_AUTH_SERVER_URL
          valueFrom:
            configMapKeyRef:
              name: etude-ai-config
              key: KEYCLOAK_AUTH_SERVER_URL
        - name: KEYCLOAK_PUBLIC_URL
          valueFrom:
            configMapKeyRef:
              name: etude-ai-config
              key: KEYCLOAK_PUBLIC_URL
        - name: KEYCLOAK_REALM
          valueFrom:
            configMapKeyRef:
              name: etude-ai-config
              key: KEYCLOAK_REALM
        - name: KEYCLOAK_RESOURCE
          valueFrom:
            configMapKeyRef:
              name: etude-ai-config
              key: KEYCLOAK_RESOURCE

        # From Secrets
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: etude-ai-secrets
              key: postgres-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: etude-ai-secrets
              key: postgres-password
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: etude-ai-secrets
              key: postgres-db
        - name: KEYCLOAK_ADMIN
          valueFrom:
            secretKeyRef:
              name: etude-ai-secrets
              key: keycloak-admin
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: etude-ai-secrets
              key: keycloak-admin-password
        - name: SENTRY_DSN_BACKEND
          valueFrom:
            secretKeyRef:
              name: etude-ai-secrets
              key: sentry-dsn-backend
        - name: ENVIRONMENT
          valueFrom:
            secretKeyRef:
              name: etude-ai-secrets
              key: environment
        - name: RELEASE_VERSION
          valueFrom:
            secretKeyRef:
              name: etude-ai-secrets
              key: release-version

        # Health checks
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8081
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        # Resource limits
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"

        # Lifecycle
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 15"]

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: etude-ai
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
  - port: 80
    targetPort: 8081
    protocol: TCP
    name: http
  type: ClusterIP

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: etude-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

