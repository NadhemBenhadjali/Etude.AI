# gateway/nginx.conf

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 50m;

  # Default proxy timeouts
  proxy_connect_timeout 30s;
  proxy_send_timeout    120s;
  proxy_read_timeout    120s;

  # Normalize missing trailing slashes
  location = /api  { return 301 /api/; }
  location = /auth { return 301 /auth/; }

  # ---------------------------
  # AI Plan endpoint - needs longer timeout (up to 5 minutes)
  # ---------------------------
  location /api/ai/plan {
    proxy_http_version 1.1;
    proxy_pass http://backend:8081;

    # Extended timeouts for AI plan generation
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Forwarded-Port   $server_port;

    proxy_set_header Upgrade            $http_upgrade;
    proxy_set_header Connection         $connection_upgrade;
  }

  # ---------------------------
  # Other AI endpoints - moderate timeout (up to 3 minutes)
  # ---------------------------
  location /api/ai/ {
    proxy_http_version 1.1;
    proxy_pass http://backend:8081;

    # Extended timeouts for AI operations
    proxy_connect_timeout 30s;
    proxy_send_timeout    180s;
    proxy_read_timeout    180s;

    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Forwarded-Port   $server_port;

    proxy_set_header Upgrade            $http_upgrade;
    proxy_set_header Connection         $connection_upgrade;
  }

  # ---------------------------
  # API -> Spring Boot backend
  # ---------------------------
  location /api/ {
    proxy_http_version 1.1;
    proxy_pass http://backend:8081;

    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Forwarded-Port   $server_port;

    proxy_set_header Upgrade            $http_upgrade;
    proxy_set_header Connection         $connection_upgrade;
  }

  # ---------------------------
  # Keycloak -> /auth
  # ---------------------------
  location /auth {
    proxy_http_version 1.1;
    proxy_pass http://keycloak:8080;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Port  $server_port;

    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;
  }

  # ---------------------------
  # Static assets caching
  # ---------------------------
  location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Do not cache index.html so new deployments roll out cleanly
  location = /index.html {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # ---------------------------
  # SPA fallback
  # ---------------------------
  location / {
    try_files $uri $uri/ /index.html;
  }
}
