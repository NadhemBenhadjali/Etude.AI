# gateway/nginx.conf

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 50m;

  # Useful in prod to avoid hanging requests
  proxy_connect_timeout 15s;
  proxy_send_timeout    60s;
  proxy_read_timeout    60s;

  # Normalize missing trailing slashes
  location = /api  { return 301 /api/; }
  location = /auth { return 301 /auth/; }

  # ---------------------------
  # API -> Spring Boot backend
  # ---------------------------
  location /api/ {
    proxy_http_version 1.1;
    proxy_pass http://backend:8081;

    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Forwarded-Port   $server_port;

    proxy_set_header Upgrade            $http_upgrade;
    proxy_set_header Connection         $connection_upgrade;
  }

  # ---------------------------
  # Keycloak -> /auth
  # ---------------------------
  location /auth/ {
    proxy_http_version 1.1;
    proxy_pass http://keycloak:8080;

  proxy_set_header Host              $http_host;
  proxy_set_header X-Forwarded-Host  $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

  }

  # ---------------------------
  # Static assets caching
  # ---------------------------
  location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Do not cache index.html so new deployments roll out cleanly
  location = /index.html {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # ---------------------------
  # SPA fallback
  # ---------------------------
  location / {
    try_files $uri $uri/ /index.html;
  }
}
